name: Sept 28 cutover (manual, one-time)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = preview only, apply = real writes"
        type: choice
        options: [dry-run, apply]
        default: dry-run
      confirm:
        description: 'For apply, type exactly: STAKE EVERYONE'
        required: false
        default: ""

concurrency:
  group: cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Guard
        if: ${{ inputs.mode == 'apply' && inputs.confirm != 'STAKE EVERYONE' }}
        run: |
          echo "Apply requires confirm = STAKE EVERYONE"
          exit 1

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Clear failed migration record (idempotent SQL, safe to re-run)
        run: npx prisma migrate resolve --rolled-back 20260926140000_staking_cutover_migration || echo "Nothing to resolve"

      - name: Apply pending DB migrations
        run: npx prisma migrate deploy
        env:
          # Supavisor session pooler can hang on pg_advisory_lock (P1002).
          # Safe here: this workflow is manual/one-time, nothing else migrates.
          PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK: "1"

      - name: Run cutover
        run: |
          if [ "${{ inputs.mode }}" = "apply" ]; then
            npx --yes tsx@4 scripts/cutover.ts --apply
          else
            npx --yes tsx@4 scripts/cutover.ts
          fi
